<svg xmlns="http://www.w3.org/2000/svg" width="560" height="120" viewBox="0 0 560 120" role="img" aria-label="SparkMyName trademark logo">
  <!-- SparkMyName(TM) official logo — star mark, white+green theme.
       Trademark application pending, Serial No. 50014040. TM only; never (R) until registration issues. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1FB25F"/>
      <stop offset="1" stop-color="#127A40"/>
    </linearGradient>
  </defs>
  <!-- Mark: green rounded tile, white star, small spark -->
  <rect x="10" y="20" width="80" height="80" rx="20" fill="url(#tile)"/>
  <path d="M50 33l7.4 17.2 18.6 1.6-14.1 12.3 4.2 18.2L50 72.7 33.9 82.3l4.2-18.2L24 51.8l18.6-1.6z" fill="#FFFFFF"/>
