  <!-- Wordmark -->
  <text x="112" y="76" font-family="Sora, Inter, system-ui, sans-serif" font-weight="800" font-size="46" letter-spacing="-1.5" fill="#141414">Spark<tspan fill="#189850">MyName</tspan></text>
  <text x="422" y="52" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#55605B">&#8482;</text>
